[package]
name = "cns-test"
version = "0.1.0"
description = "CNS Test desktop application"
edition = "2021"
publish = false

[lib]
name = "cns_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
cns-licensing = { path = "crates/licensing" }
machine-uid = "0.5"
getrandom = "0.3"

[dev-dependencies]
cns-licensing = { path = "crates/licensing", features = ["issuer"] }

[workspace]
members = ["crates/licensing", "crates/license-tool"]

[profile.release]
strip = true
lto = true
codegen-units = 1
